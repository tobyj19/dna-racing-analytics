### **STEP 4: Delete Old Pages**

1. Go to `pages/` folder
2. For each old file, click on it
3. Click the **trash can icon** (Delete this file)
4. Scroll down, click **"Commit changes"**

**Delete these 8 files:**
- `1_🔍_Core_Search.py`
- `2_📊_Performance_Analysis.py`
- `3_🏁_Race_History.py`
- `4_🧬_Breeding_Lineage.py`
