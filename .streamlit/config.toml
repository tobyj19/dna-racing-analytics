## **❓ Common Issues**

### **"I don't see .streamlit folder"**
- GitHub hides folders starting with `.` sometimes
- Click "Go to file" at top and type `.streamlit/config.toml`
- If it exists, you'll find it

### **"Home.py is inside pages/ folder"**
- Delete it from pages/
- Re-upload to root level (same level as README)

### **"Can't rename - it duplicates"**
- Delete the old file first
- Then upload the new renamed file

