### **STEP 3: Rename Page Files (Remove Emojis)**

You need to rename each page file. Here's how for ONE file (then repeat):

**Example: Rename Core Analytics**

1. Go to `pages/` folder in GitHub
2. Click on `1_🔍_Core_Analytics.py`
3. Click the **pencil icon** (Edit this file)
4. At the top, you'll see the filename
5. Click the **filename** itself to edit it
6. Change from: `1_🔍_Core_Analytics.py`
7. Change to: `1_Core_Analytics.py` (remove the 🔍 emoji)
8. Scroll down, click **"Commit changes"**

**Repeat for all 7 pages:**

| Old Name (with emoji) | New Name (no emoji) |
|----------------------|---------------------|
| `1_🔍_Core_Analytics.py` | `1_Core_Analytics.py` |
| `5_⚖️_Core_Comparison.py` | `2_Core_Comparison.py` |
| `6_🏁_Race_Finder.py` | `3_Race_Finder.py` |
| `COMPLETE_4_🏦_Vault_Portfolio.py` | `4_Vault_Portfolio.py` |
| `5_🧬_Breeding_Analyzer.py` | `5_Breeding_Analyzer.py` |
| `6_🏁_Speed_Rankings.py` | `6_Speed_Rankings.py` |
| `7_🗄️_Power_Database.py` | `7_Power_Database.py` |

